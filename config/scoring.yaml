# ==============================================================================
# RepoVet MCP - Scoring Configuration
# Defines the 10 scorecard criteria (0-20 scale), criteria definitions,
# scoring rubrics (0, 1, 2), and mapping to the 9 vetting phases.
# ==============================================================================

version: "1.1.0"
scale:
  min_score_per_criterion: 0
  max_score_per_criterion: 2
  total_criteria: 10
  max_total_score: 20

criteria:
  - id: "gsoc_history"
    name: "GSoC History & Mentorship Track Record"
    phase: "phase_9_mentorship_and_gsoc"
    weight: 1.0
    max_score: 2
    description: "Evaluates participation history in GSoC or mentorship programs, public project ideas lists, and dedicated mentor accessibility."
    rubric:
      score_0: "Unsuitable / Closed: No mentorship track record; repository explicitly closed to student contributors or lacks project roadmap."
      score_1: "Potential / Unstructured: Receptive to contributions, but no formal GSoC track record or uncurated ideas list."
      score_2: "Established Mentorship: Confirmed GSoC participating organization, published project ideas list, and active mentor engagement."

  - id: "commit_activity"
    name: "Commit Activity & Maintenance Cadence"
    phase: "phase_2_vitality_and_pulse"
    weight: 1.0
    max_score: 2
    description: "Evaluates commit frequency, default branch freshness, and release cadence over the last 12 months."
    rubric:
      score_0: "Abandoned / Dormant: No commits or releases within the last 12 months; archived or neglected repository."
      score_1: "Sporadic Maintenance: Commits within the last 3-6 months, but irregular release cadence or noticeable lulls in activity."
      score_2: "Vibrant & Continuous: Regular commits within the past 30 days, documented release history, and continuous active maintenance."

  - id: "contributor_spread"
    name: "Contributor Spread & Decentralization"
    phase: "phase_3_governance_and_culture"
    weight: 1.0
    max_score: 2
    description: "Evaluates contributor diversity, bus factor risk, and commit share across core maintainers vs community."
    rubric:
      score_0: "High Bus Factor Risk: Over 90% of commits come from a single contributor; no external contribution integration."
      score_1: "Moderate Spread: Small core team of 2-3 contributors; moderate external contributor participation."
      score_2: "Healthy Decentralization: Diverse contributor base; top contributor accounts for <50% of recent commits; active multi-maintainer team."

  - id: "pr_first_response"
    name: "PR First Human Response Time"
    phase: "phase_4_responsiveness_and_velocity"
    weight: 1.0
    max_score: 2
    description: "Evaluates median turnaround time for maintainers to provide the first human review or comment on pull requests."
    rubric:
      score_0: "Unresponsive: Pull requests languish without human review for >30 days; high contributor abandonment rate."
      score_1: "Moderate Response: Median human response time between 3 and 14 days; PR backlog occasionally builds."
      score_2: "Fast & Welcoming: Median human response time <72 hours, providing constructive reviews and rapid engagement."

  - id: "issue_response_rate"
    name: "Issue Human Response Rate"
    phase: "phase_4_responsiveness_and_velocity"
    weight: 1.0
    max_score: 2
    description: "Evaluates the proportion of issues receiving human maintainer responses and timely triage."
    rubric:
      score_0: "Unattended: Greater than 50% of recent issues receive zero human comments; issue tracker is a graveyard."
      score_1: "Partial Triage: 25% to 50% of issues remain unanswered, or responses take several weeks."
      score_2: "Actively Triaged: Greater than 75% of issues receive prompt human maintainer replies (<25% unanswered)."

  - id: "newcomer_prs_merged"
    name: "Newcomer PRs Acceptance & Merge Rate"
    phase: "phase_6_issue_hygiene_and_accessibility"
    weight: 1.0
    max_score: 2
    description: "Evaluates the willingness of maintainers to review, guide, and merge pull requests from first-time and external contributors."
    rubric:
      score_0: "Hostile / Closed to Outsiders: External PRs are routinely closed without explanation or ignored indefinitely; 0 newcomer PRs merged."
      score_1: "Cautious: Occasional external PRs merged (1-4 in sample), but lengthy review cycles or stringent unwritten hurdles."
      score_2: "Welcoming & Merging: Active track record of merging newcomer PRs (>5 or >60% acceptance rate for valid PRs) with constructive feedback."

  - id: "beginner_issues"
    name: "Beginner Issues & Newcomer Hygiene"
    phase: "phase_6_issue_hygiene_and_accessibility"
    weight: 1.0
    max_score: 2
    description: "Evaluates presence and quality of beginner-friendly labeled issues ('good first issue', 'help wanted', 'beginner')."
    rubric:
      score_0: "Absent: Zero issues tagged for beginners; issue tracker lacks onboarding entry points."
      score_1: "Limited / Stale: Occasional beginner labels exist (1-3), but some are outdated, misclassified, or lack clear descriptions."
      score_2: "Well-Curated Backlog: Actively maintained 'good first issue' backlog (>3 open, verified items) with clear acceptance criteria."

  - id: "docs_and_setup"
    name: "Documentation & Local Setup Clarity"
    phase: "phase_5_documentation_and_onboarding"
    weight: 1.0
    max_score: 2
    description: "Evaluates README clarity, architecture overviews, local build/test setup reproducibility, and CONTRIBUTING.md standards."
    rubric:
      score_0: "Deficient: Missing, broken, or empty README; absent setup and build instructions; no CONTRIBUTING.md."
      score_1: "Partial: Basic README explaining project overview, but missing prerequisites, troubleshooting, or test setup."
      score_2: "Exemplary: Comprehensive README, architecture diagram, step-by-step local build/test guide, and detailed CONTRIBUTING.md."

  - id: "ci_and_code_quality"
    name: "CI Workflows & Automated Testing"
    phase: "phase_7_ci_cd_and_testing"
    weight: 1.0
    max_score: 2
    description: "Evaluates automated continuous integration workflows, default branch build status, test suite presence, and coverage."
    rubric:
      score_0: "Untested / Broken: No automated CI workflows, absent test suite, or persistently failing default branch builds."
      score_1: "Partial CI: Automated CI present, but test suite coverage is sparse, tests are flaky, or builds occasionally fail."
      score_2: "Robust & Green: Automated CI workflows passing on default branch, comprehensive test suite, and automated linting."

  - id: "community_tone_and_chat"
    name: "Community Tone & Discussion Channels"
    phase: "phase_3_governance_and_culture"
    weight: 1.0
    max_score: 2
    description: "Evaluates community culture, Code of Conduct presence, and public synchronous/asynchronous communication channels."
    rubric:
      score_0: "Toxic / Isolated: Abrasive maintainer tone observed, or no Code of Conduct and zero public discussion channels."
      score_1: "Standard: CODE_OF_CONDUCT.md present, but minimal community interaction history or absent real-time chat/Discussions."
      score_2: "Inclusive & Accessible: Clear Code of Conduct with reporting contacts, welcoming maintainer tone, and active community chat (Discord/Slack/Discussions)."
